version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alvin_app
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ./:/app
      - ./storage/logs:/app/storage/logs
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - alvin_network

  db:
    image: postgres:15-alpine
    container_name: alvin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-alvin_db}
      POSTGRES_USER: ${DB_USERNAME:-alvin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alvin_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - alvin_network

  redis:
    image: redis:7-alpine
    container_name: alvin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - alvin_network

  nginx:
    image: nginx:alpine
    container_name: alvin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - alvin_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: alvin_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - alvin_network

volumes:
  db_data:
    driver: local

networks:
  alvin_network:
    driver: bridge
